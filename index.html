<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit and Goal Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Daily Progress Dashboard</h1>
    <p>Small daily actions create big results. Stay consistent and track your progress</p>
  </header>

  <main>
    
    <section class="box">
      <h2 id="summaryText">This week: 0 of 0 ticks</h2>
      <div class="bar"><div id="summaryFill"></div></div>
      <button id="resetBtn" class="grayBtn">Start a new week</button>
    </section>

    <section class="box">
      <h2>My habits</h2>
      <div class="addRow">
        <input type="text" id="habitInput" placeholder="New habit, e.g. Running">
        <button id="addHabitBtn">Add habit</button>
      </div>
      <ul id="habitList"></ul>
    </section>

    
    <section class="box">
      <h2>My goals</h2>
      <div class="addRow">
        <input type="text" id="goalInput" placeholder="New goal, e.g. Read books">
        <input type="number" id="goalTarget" placeholder="Target" min="1">
        <button id="addGoalBtn">Add goal</button>
      </div>
      <ul id="goalList"></ul>
    </section>
  </main>

  <footer>Built By Vishal</footer>

  <script src="script.js"></script>
</body>
</html>
